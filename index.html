body {

/* ── Header ── */
header {

}
.logo-wrap { display: flex; align-items: center; gap: .6rem; flex: 1; }
.logo-icon {

  border-radius: 8px;

}
.logo-text { font-size: 1rem; font-weight: 700; letter-spacing: .01em; }
.logo-sub  { font-size: .65rem; opacity: .5; margin-top: 1px; }
.badge {
  background: var(--brand);
  font-size: .63rem;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 20px;
  letter-spacing: .05em;
}
#headerReviewer {
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.18);
  color: #fff;
  border-radius: 6px;
  padding: .3rem .7rem;
  font-size: .8rem;
  outline: none;
  width: 160px;
}
#headerReviewer::placeholder { color: rgba(255,255,255,.4); }
#headerReviewer:focus { border-color: var(--brand); background: rgba(255,255,255,.12); }

/* ── Sync status chip ── */
#syncChip {
  font-size: .7rem;
  padding: .22rem .65rem;
  border-radius: 20px;
  font-weight: 600;
  white-space: nowrap;
  transition: all .3s;
  cursor: default;
}
#syncChip.idle    { background: rgba(255,255,255,.1);  color: rgba(255,255,255,.55); }
#syncChip.syncing { background: var(--amber-l);        color: var(--amber); }
#syncChip.ok      { background: var(--green-l);        color: var(--green); }
#syncChip.err     { background: var(--red-l);          color: var(--red); }

/* ── Upload Screen ── */
#uploadScreen {
  max-width: 620px;
  margin: 3rem auto;
  padding: 0 1rem;
}
.upload-card {
  background: #fff;
  border-radius: 12px;
  box-shadow: var(--shadow-md);
  padding: 2rem;
}
.upload-card h2 { font-size: 1.1rem; margin-bottom: .35rem; color: var(--navy); }
.upload-card p  { color: var(--gray-600); margin-bottom: 1.5rem; font-size: .84rem; line-height: 1.55; }
.file-row { display: flex; flex-direction: column; gap: .35rem; margin-bottom: 1rem; }
.file-row label { font-weight: 700; font-size: .8rem; color: var(--gray-700); }
.file-row span  { font-size: .73rem; color: var(--gray-400); }
.file-input-wrap {
  border: 2px dashed var(--gray-300);
  border-radius: 8px;
  padding: .9rem;
  text-align: center;
  cursor: pointer;
  transition: border-color .2s, background .2s;
  position: relative;
}
.file-input-wrap:hover { border-color: var(--brand); background: var(--brand-l); }
.file-input-wrap.active { border-color: var(--brand); background: var(--brand-l); }
.file-input-wrap input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.file-input-wrap .hint  { font-size: .75rem; color: var(--gray-600); }
.file-input-wrap .fname { font-size: .75rem; color: var(--brand); font-weight: 600; margin-top: .2rem; }
.base-url-row { margin-bottom: 1.5rem; }
.base-url-row label { display: block; font-weight: 700; font-size: .8rem; color: var(--gray-700); margin-bottom: .3rem; }
.base-url-row input {
  width: 100%; border: 1px solid var(--gray-300); border-radius: 6px;
  padding: .42rem .7rem; font-size: .84rem; outline: none;
}
.base-url-row input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-l); }

/* ── Buttons ── */
.btn {
  display: inline-flex; align-items: center; gap: .4rem;
  padding: .52rem 1.1rem; border-radius: 7px;
  font-size: .84rem; font-weight: 600;
  cursor: pointer; border: none;
  transition: opacity .15s, transform .1s;
}
.btn:active { transform: scale(.97); }
.btn-brand   { background: var(--brand);    color: #fff; }

.btn-brand:disabled { opacity: .4; cursor: not-allowed; }
.btn-secondary { background: var(--gray-200); color: var(--gray-700); }
.btn-secondary:hover { background: var(--gray-300); }
.btn-danger  { background: var(--red); color: #fff; }
.btn-danger:hover { opacity: .88; }
.btn-sm { padding: .32rem .75rem; font-size: .76rem; }
.btn-ghost {
  background: transparent; border: 1.5px solid rgba(255,255,255,.25);
  color: rgba(255,255,255,.8);
}
.btn-ghost:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.5); color: #fff; }

/* ── Main App ── */
#app { display: none; max-width: 1120px; margin: 0 auto; padding: 1rem; }

/* ── Toolbar ── */
.toolbar {
  display: flex; flex-wrap: wrap; gap: .6rem; align-items: center;
  margin-bottom: 1rem;
  background: #fff; border-radius: 10px; padding: .75rem 1rem;
  box-shadow: var(--shadow);
}
.search-wrap { flex: 1; min-width: 180px; position: relative; }
.search-wrap svg {
  position: absolute; left: .6rem; top: 50%; transform: translateY(-50%);

}
#searchInput {
  width: 100%; border: 1px solid var(--gray-300); border-radius: 6px;

}
#searchInput:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-l); }
.filter-group { display: flex; gap: .35rem; flex-wrap: wrap; }
.filter-btn {
  padding: .28rem .7rem; border-radius: 20px; font-size: .73rem; font-weight: 600;

}
.filter-btn:hover  { border-color: var(--brand); color: var(--brand); }
.filter-btn.active { background: var(--brand); border-color: var(--brand); color: #fff; }

/* ── Progress ── */

.progress-header {

}
.progress-header strong { color: var(--gray-900); }
.progress-track { background: var(--gray-200); border-radius: 999px; height: 8px; overflow: hidden; }

.progress-stats { display: flex; gap: .75rem; margin-top: .5rem; flex-wrap: wrap; }
.stat-chip { font-size: .7rem; padding: .18rem .55rem; border-radius: 20px; font-weight: 600; }
.stat-chip.reviewed   { background: var(--teal-l);  color: #0f766e; }
.stat-chip.relevant   { background: var(--green-l); color: var(--green); }
.stat-chip.irrelevant { background: var(--red-l);   color: var(--red); }
.stat-chip.skipped    { background: var(--amber-l); color: var(--amber); }

/* ── Validation warning banner ── */
.warn-banner {

}

/* ── Card ── */
.review-card {
  background: #fff; border-radius: 12px;
  box-shadow: var(--shadow-md); overflow: hidden; margin-bottom: 1rem;
}

/* Source header */
.card-source {

  border-bottom: 3px solid var(--brand);
}
.card-source-label {

.card-source-name {

.card-source-meta { display: flex; gap: .45rem; margin-top: .4rem; flex-wrap: wrap; }
.meta-tag {

}
.card-num { font-size: .72rem; opacity: .45; white-space: nowrap; padding-top: .15rem; }
.url-missing { color: #fca5a5; font-size: .68rem; margin-top: .3rem; display: flex; align-items: center; gap: .25rem; }

.rec-table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .82rem; }
th {

}

  font-size: .8rem; font-weight: 600;

  z-index: 999; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }

#mapperScreen { display: none; max-width: 680px; margin: 2rem auto; padding: 0 1rem; }
.mapper-card { background: #fff; border-radius: 12px; box-shadow: var(--shadow-md); padding: 2rem; }

.mapper-row label { display: block; font-size: .74rem; font-weight: 700; color: var(--gray-700); margin-bottom: .22rem; }
.mapper-row select {

  padding: .38rem .6rem; font-size: .8rem; outline: none; background: #fff;
}
.mapper-row select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-l); }

.spinner {
  display: inline-block; width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,.3); border-top-color: #fff;
  border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 640px) {
  .mapper-grid { grid-template-columns: 1fr; }
  .card-source { flex-direction: column; }
  table { font-size: .74rem; }
  td, th { padding: .45rem .55rem; }
}

<script>
// ══════════════════════════════════════════════════════════════
//  CENTRAL CONFIG — single source of truth
// ══════════════════════════════════════════════════════════════
const CONFIG = {
  brandName: 'FlowerAura',
  baseUrl:   'https://www.floweraura.com',  // FlowerAura — never any other domain
};

// ══════════════════════════════════════════════════════════════
//  UTILITIES
// ══════════════════════════════════════════════════════════════
function parseCSV(text) {
  const lines = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  const rows = [];
  for (const line of lines) {
    if (!line.trim()) continue;
    const row = []; let inQ = false, cell = '';
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { if (inQ && line[i+1]==='"') { cell+='"'; i++; } else inQ = !inQ; }
      else if (c === ',' && !inQ) { row.push(cell.trim()); cell = ''; }
      else cell += c;
    }
    row.push(cell.trim());
    rows.push(row);
  }
  if (rows.length < 2) return [];
  const headers = rows[0].map(h => h.replace(/^"|"$/g,'').trim());
  return rows.slice(1).map(r => {
    const obj = {};
    headers.forEach((h,i) => obj[h] = (r[i]||'').replace(/^"|"$/g,'').trim());
    return obj;
  });
}

function readFile(file) {
  return new Promise((res,rej) => {
    const fr = new FileReader();
    fr.onload = e => res(e.target.result);
    fr.onerror = rej;
    fr.readAsText(file, 'utf-8');
  });
}

function resolveUrl(url, base) {
  if (!url) return '';
  url = url.trim();
  if (/^https?:\/\//i.test(url)) return url;
  const b = (base || CONFIG.baseUrl).replace(/\/$/,'');
  return b + (url.startsWith('/') ? url : '/' + url);
}

function showToast(msg, dur=2600) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), dur);
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escapeCSV(v) {
  const s = String(v??'');
  return s.includes(',') || s.includes('"') || s.includes('\n') ? `"${s.replace(/"/g,'""')}"` : s;
}

// ══════════════════════════════════════════════════════════════
//  COLUMN AUTO-DETECTION
// ══════════════════════════════════════════════════════════════
const COL_PATTERNS = {
  source_id:    [/^source[_\s-]?id$/i, /^src[_\s-]?id$/i, /^guid$/i],
  source_name:  [/source[_\s-]?name/i, /src[_\s-]?name/i],
  source_url:   [/source[_\s-]?url/i,  /src[_\s-]?url/i, /source[_\s-]?link/i],
  source_price: [/source[_\s-]?price/i,/src[_\s-]?price/i],
  result_name:  [/result[_\s-]?name/i, /rec[_\s-]?name/i, /suggestion[_\s-]?name/i],
  result_url:   [/result[_\s-]?url/i,  /rec[_\s-]?url/i,  /suggestion[_\s-]?url/i],
  result_price: [/result[_\s-]?price/i,/rec[_\s-]?price/i],
  score:        [/structural[_\s-]?score/i, /similarity[_\s-]?score/i, /^score$/i],
  match_quality:[/match[_\s-]?quality/i, /match[_\s-]?type/i, /quality/i],
  rank:         [/^rank$/i, /^position$/i, /^order$/i],
  prod_id:      [/^guid$/i, /^id$/i, /product[_\s-]?id/i],
  prod_url:     [/^url$/i,  /^link$/i, /product[_\s-]?url/i],
};

function detectColumns(headers, keys) {
  const out = {};
  for (const key of keys) {
    for (const pat of (COL_PATTERNS[key]||[])) {
      const h = headers.find(h => pat.test(h));
      if (h) { out[key] = h; break; }
    }
  }
  return out;
}

// ══════════════════════════════════════════════════════════════
//  DATA LAYER — central state
// ══════════════════════════════════════════════════════════════
const DATA = {
  groups: [],       // Array<GroupObject>
  filtered: [],     // Array<index into groups>
  colMap: {},
  baseUrl: CONFIG.baseUrl,
  validation: {     // populated at build time
    missingSourceUrl: [],   // sourceKeys with no URL
    missingRecUrl: [],      // {sourceKey, recName, rank}
    total: 0,
    ok: 0,
  },
};

const UI = {
  currentPage: 1,
  pageSize: 10,
  filterMode: 'all',
  searchQuery: '',
};

function buildGroups(rows, colMap, prodUrlMap, baseUrl) {
  const grouped = new Map();
  const missingRecUrl = [];

  for (const row of rows) {
    const sourceId   = colMap.source_id    ? row[colMap.source_id]    : '';
    const sourceName = colMap.source_name  ? row[colMap.source_name]  : '';
    const rawSrcUrl  = colMap.source_url   ? row[colMap.source_url]   : '';
    const sourceUrl  = resolveUrl(rawSrcUrl || prodUrlMap[sourceId] || prodUrlMap[sourceName] || '', baseUrl);
    const sourcePrice= colMap.source_price ? row[colMap.source_price] : '';

    const key = sourceId || sourceName;
    if (!grouped.has(key)) {
      grouped.set(key, {
        sourceKey: key,
        sourceName,
        sourceUrl,       // Exact URL from FlowerAura products sheet
        sourceMeta: { price: sourcePrice },
        recs: [],
      });
    }

    const grp  = grouped.get(key);
    const rawRecUrl = colMap.result_url ? row[colMap.result_url] : '';
    const recUrl    = resolveUrl(rawRecUrl, baseUrl);
    const recName   = colMap.result_name  ? row[colMap.result_name]  : '';
    const rank      = parseInt(colMap.rank ? row[colMap.rank] : '0') || grp.recs.length + 1;

    if (!recUrl) missingRecUrl.push({ sourceKey: key, recName, rank });

    grp.recs.push({
      name:         recName,
      url:          recUrl,   // Exact URL from suggestions sheet
      price:        colMap.result_price  ? row[colMap.result_price]  : '',
      score:        colMap.score         ? row[colMap.score]         : '',
      matchQuality: colMap.match_quality ? row[colMap.match_quality] : '',
      rank,
      hasUrl:       !!recUrl,
    });
  }

  for (const grp of grouped.values()) grp.recs.sort((a,b) => a.rank - b.rank);

  // Validation
  const missingSourceUrl = Array.from(grouped.values()).filter(g => !g.sourceUrl).map(g => g.sourceKey);
  DATA.validation = {
    missingSourceUrl,
    missingRecUrl,
    total:  rows.length,
    ok:     rows.length - missingRecUrl.length,
  };

  return Array.from(grouped.values());
}

// ══════════════════════════════════════════════════════════════
//  LOCAL STORAGE
// ══════════════════════════════════════════════════════════════
const LS_KEY      = 'fa_sprReviews_v1';
const LS_REVIEWER = 'fa_sprReviewer';
const LS_SHEETS   = 'fa_sheetsUrl';

function loadReviews()     { try { return JSON.parse(localStorage.getItem(LS_KEY)||'{}'); } catch { return {}; } }
function saveReviews(r)    { localStorage.setItem(LS_KEY, JSON.stringify(r)); }
function getReview(key)    { return loadReviews()[key] || null; }
function setReview(key, d) {
  const r = loadReviews();
  r[key]  = { ...d, updatedAt: new Date().toISOString() };
  saveReviews(r);
}

// ══════════════════════════════════════════════════════════════
//  GOOGLE SHEETS SYNC
// ══════════════════════════════════════════════════════════════
const DEFAULT_SHEETS_URL = 'https://script.google.com/macros/s/AKfycbwlpqWVizPbILm87R3PmJHps1b2KN8bEcm3lsH-f-kkWPIQ704V96Etg7SF9pdWRSApBg/exec';
let sheetsUrl   = localStorage.getItem(LS_SHEETS) || DEFAULT_SHEETS_URL;
const LS_QUEUE  = 'fa_syncQueue_v1';
let syncInFlight = false;

function setSyncStatus(status, label) {
  const chip = document.getElementById('syncChip');
  if (!chip) return;
  chip.className = status;
  chip.textContent = label;
}

function setSheetsBannerStatus() {} // banner removed — no-op kept for safety

// Offline queue — stores payloads that failed, retried on next sync
function loadQueue()      { try { return JSON.parse(localStorage.getItem(LS_QUEUE)||'[]'); } catch { return []; } }
function saveQueue(q)     { localStorage.setItem(LS_QUEUE, JSON.stringify(q)); }
function enqueue(payload) { const q = loadQueue(); q.push(payload); saveQueue(q); }

async function flushQueue() {
  if (!sheetsUrl || syncInFlight) return;
  const q = loadQueue();
  if (!q.length) return;
  syncInFlight = true;
  const failed = [];
  for (const payload of q) {
    try {
      await fetch(sheetsUrl, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(payload) });
    } catch { failed.push(payload); }
  }
  saveQueue(failed);
  syncInFlight = false;
  if (failed.length === 0 && q.length > 0) showToast(`✓ ${q.length} queued review${q.length>1?'s':''} synced to Sheets`);
}

async function syncToSheets(key, reviewData) {
  if (!sheetsUrl) return;
  const grp = DATA.groups.find(g => g.sourceKey === key);
  if (!grp) return;

  const reviewer = document.getElementById('headerReviewer').value || 'anonymous';
  const payload  = {
    reviewer,
    sourceKey:  key,
    sourceName: grp.sourceName,
    sourceUrl:  grp.sourceUrl,
    relevant:   reviewData.relevant  || '',
    rating:     reviewData.rating    || '',
    comment:    reviewData.comment   || '',
    timestamp:  reviewData.updatedAt || new Date().toISOString(),
  };

  setSyncStatus('syncing', '⬤ syncing…');
  try {
    await fetch(sheetsUrl, {
      method:  'POST',
      mode:    'no-cors',
      headers: {'Content-Type':'text/plain'},
      body:    JSON.stringify(payload),
    });
    setSyncStatus('ok', '✓ synced');
    setTimeout(()=>setSyncStatus('idle', sheetsUrl ? '⬤ connected' : '⬤ local only'), 2500);
    flushQueue(); // flush any previously queued items
  } catch(e) {
    enqueue(payload); // store for retry
    setSyncStatus('err', '✗ queued');
    setTimeout(()=>setSyncStatus('idle', '⬤ queued'), 3000);
  }
}

// Connection test — sends a real test POST (no-cors, same as live reviews)
// Apps Script does not expose CORS headers for GET, so we never use GET to test.
async function testSheetsConnection() {
  setSyncStatus('syncing', '⬤ testing…');
  showToast('Sending test row to your Sheet…');
  try {
    await fetch(sheetsUrl, {
      method:  'POST',
      mode:    'no-cors',     // required for Apps Script — response is opaque but request goes through
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        reviewer:   'Connection Test',
        sourceKey:  '__test__',
        sourceName: '[Test Row — safe to delete]',
        sourceUrl:  '',
        relevant:   'test',
        rating:     '',
        comment:    'Sent from review tool to verify sync is working.',
        timestamp:  new Date().toISOString(),
      }),
    });
    setSyncStatus('ok', '⬤ synced');
    showToast('✓ Test sent! Check your Google Sheet for a "[Test Row]" entry.', 4000);
    setTimeout(() => setSyncStatus('idle', '⬤ connected'), 3000);
  } catch(e) {
    setSyncStatus('err', '✗ failed');
    showToast('Could not reach Apps Script URL. Check the URL and try again.');
    setTimeout(() => setSyncStatus('idle', '⬤ connected'), 3000);
  }
}

function applyFiltersAndSearch() {
  const q = UI.searchQuery.toLowerCase();
  const reviews = loadReviews();
  DATA.filtered = DATA.groups
    .map((g,i) => ({g,i}))
    .filter(({g,i}) => {
      if (q && !g.sourceName.toLowerCase().includes(q)) return false;
      const rev = reviews[g.sourceKey];
      const hasWarn = !g.sourceUrl || g.recs.some(r => !r.hasUrl);
      switch (UI.filterMode) {
        case 'pending':    return !rev;
        case 'reviewed':   return !!rev;
        case 'relevant':   return rev?.relevant === 'yes';
        case 'irrelevant': return rev?.relevant === 'no';
        case 'warn':       return hasWarn;
        default: return true;
      }
    })
    .map(({i}) => i);
}

function renderProgress() {
  const reviews = loadReviews();
  const total     = DATA.groups.length;
  const reviewed  = DATA.groups.filter(g => reviews[g.sourceKey]).length;
  const relevant  = DATA.groups.filter(g => reviews[g.sourceKey]?.relevant === 'yes').length;
  const irrelevant= DATA.groups.filter(g => reviews[g.sourceKey]?.relevant === 'no').length;
  const pending   = total - reviewed;
  const pct       = total ? Math.round(reviewed/total*100) : 0;

  document.getElementById('progText').textContent      = `${reviewed} / ${total}`;
  document.getElementById('progPct').textContent       = `${pct}%`;
  document.getElementById('progressFill').style.width  = pct + '%';
  document.getElementById('statReviewed').textContent  = `${reviewed} reviewed`;
  document.getElementById('statRelevant').textContent  = `${relevant} relevant`;
  document.getElementById('statIrrelevant').textContent= `${irrelevant} not relevant`;
  document.getElementById('statPending').textContent   = `${pending} pending`;
  document.getElementById('exportInfo').textContent    =
    `${reviewed} of ${total} reviewed · auto-saved${sheetsUrl ? ' & synced to Sheets' : ' locally'}.`;

  // Validation warning
  const warnEl = document.getElementById('warnBanner');
  const warnTx = document.getElementById('warnText');
  const mSrc = DATA.validation.missingSourceUrl.length;
  const mRec = DATA.validation.missingRecUrl.length;
  if (mSrc > 0 || mRec > 0) {
    warnEl.style.display = 'flex';
    const parts = [];
    if (mSrc) parts.push(`${mSrc} source product${mSrc>1?'s':''} missing URL`);
    if (mRec) parts.push(`${mRec} recommendation${mRec>1?'s':''} missing URL`);
    warnTx.textContent = parts.join(' · ') + '. Click "Validation Report" for details.';
  } else {
    warnEl.style.display = 'none';
  }
}

function renderCards() {
  applyFiltersAndSearch();
  renderProgress();

  const container = document.getElementById('cardContainer');
  const total  = DATA.filtered.length;
  const ps     = UI.pageSize;
  const maxPage= Math.max(1, Math.ceil(total/ps));
  if (UI.currentPage > maxPage) UI.currentPage = maxPage;

  const pageIdx = DATA.filtered.slice((UI.currentPage-1)*ps, UI.currentPage*ps);

  if (!pageIdx.length) {
    container.innerHTML = `<div class="empty-state"><p>No products match your filter.</p></div>`;
    renderPagination(0, 0);
    return;
  }

  container.innerHTML = pageIdx.map(idx => renderCard(DATA.groups[idx])).join('');

  // Bind events for this page
  pageIdx.forEach(idx => {
    const grp = DATA.groups[idx];
    const k   = grp.sourceKey;

    // Relevance
    container.querySelectorAll(`[data-rel-key="${CSS.escape(k)}"]`).forEach(btn => {
      btn.addEventListener('click', () => {
        const val = btn.dataset.rel;
        const cur = getReview(k)?.relevant;
        const rev = { ...(getReview(k)||{}), relevant: cur===val ? null : val };
        setReview(k, rev);
        syncToSheets(k, rev);
        flashSave(k);
        renderCards();
      });
    });

    // Stars
    container.querySelectorAll(`[data-star-key="${CSS.escape(k)}"]`).forEach(star => {
      star.addEventListener('click', () => {
        const val = parseInt(star.dataset.star);
        const cur = getReview(k)?.rating;
        const rev = { ...(getReview(k)||{}), rating: cur===val ? 0 : val };
        setReview(k, rev);
        syncToSheets(k, rev);
        flashSave(k);
        renderCards();
      });
    });

    // Comment
    const commentEl = container.querySelector(`[data-comment-key="${CSS.escape(k)}"]`);
    if (commentEl) {
      let timer;
      commentEl.addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(() => {
          const rev = { ...(getReview(k)||{}), comment: commentEl.value };
          setReview(k, rev);
          syncToSheets(k, rev);
          flashSave(k);
          renderProgress();
        }, 700);
      });
    }
  });

  renderPagination(total, maxPage);
}

function flashSave(key) {
  const el = document.querySelector(`[data-save-key="${CSS.escape(key)}"]`);
  if (!el) return;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2000);
}

function renderCard(grp) {
  const rev = getReview(grp.sourceKey) || {};
  const reviewed = !!(rev.relevant || rev.rating || rev.comment);
  const hasWarn  = !grp.sourceUrl || grp.recs.some(r => !r.hasUrl);

  // Source product — clickable name, image placeholder, view btn all point to sourceUrl
  const srcUrlAttr = grp.sourceUrl ? `href="${escHtml(grp.sourceUrl)}" target="_blank" rel="noopener"` : '';
  const sourceLink = grp.sourceUrl
    ? `<a ${srcUrlAttr}>${escHtml(grp.sourceName)}</a>`
    : `<span style="color:rgba(255,255,255,.6)">${escHtml(grp.sourceName)}</span>`;

  const urlMissingNote = !grp.sourceUrl
    ? `<div class="url-missing">⚠ No FlowerAura URL found for this source product</div>`
    : '';

  const statusDot = reviewed
    ? `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;
        background:${rev.relevant==='yes'?'#86efac':rev.relevant==='no'?'#fca5a5':'#fcd34d'};
        margin-right:.3rem;flex-shrink:0"></span>`
    : '';

  const viewSourceBtn = grp.sourceUrl
    ? `<a href="${escHtml(grp.sourceUrl)}" target="_blank" rel="noopener"
         style="font-size:.7rem;padding:.2rem .6rem;border-radius:5px;
                background:rgba(255,255,255,.15);color:#fff;text-decoration:none;
                font-weight:700;border:1px solid rgba(255,255,255,.2);white-space:nowrap;
                transition:background .15s;"
         onmouseover="this.style.background='var(--brand)'"
         onmouseout="this.style.background='rgba(255,255,255,.15)'">View Product ↗</a>`
    : '';

  const metaParts = [];
  if (grp.sourceMeta?.price) metaParts.push(`₹${grp.sourceMeta.price}`);
  if (hasWarn) metaParts.push('⚠ URL issues');

  const recRows = grp.recs.map(rec => {
    const scoreNum = parseFloat(rec.score);
    const scorePct = isNaN(scoreNum) ? null : Math.min(100, Math.max(0, scoreNum>1 ? scoreNum : scoreNum*100));
    const scoreBar = scorePct !== null
      ? `<div class="score-bar">
           <div class="score-track"><div class="score-fill" style="width:${scorePct}%"></div></div>
           <span class="score-val">${scoreNum>1 ? scoreNum.toFixed(1) : (scoreNum*100).toFixed(0)+'%'}</span>
         </div>`
      : `<span style="color:var(--gray-400);font-size:.7rem">—</span>`;

    const matchChip = rec.matchQuality
      ? `<span class="match-chip">${escHtml(rec.matchQuality.replace(/-/g,' '))}</span>` : '';

    // Recommendation link — exact URL from suggestions sheet, no dynamic generation
    const recNameCell = rec.url
      ? `<a class="rec-link" href="${escHtml(rec.url)}" target="_blank" rel="noopener">${escHtml(rec.name)}</a>`
      : `<span class="rec-link-missing" title="No URL available for this recommendation">⚠ ${escHtml(rec.name)}</span>`;

    const viewRecBtn = rec.url
      ? `<a class="view-btn" href="${escHtml(rec.url)}" target="_blank" rel="noopener">View ↗</a>` : '';

    return `<tr>
      <td><span class="rank-badge${rec.rank<=3?' top':''}">${rec.rank}</span></td>
      <td>${recNameCell}</td>
      <td>${rec.price ? `<span style="font-weight:600">₹${escHtml(rec.price)}</span>` : '—'}</td>
      <td>${scoreBar}</td>
      <td>${matchChip}</td>
      <td>${viewRecBtn}</td>
    </tr>`;
  }).join('');

  const stars = [1,2,3,4,5].map(n =>
    `<span class="star${(rev.rating||0)>=n?' active':''}" data-star="${n}" data-star-key="${grp.sourceKey}">${(rev.rating||0)>=n?'★':'☆'}</span>`
  ).join('');

  return `<div class="review-card">
    <div class="card-source">
      <div class="card-source-info">
        <div class="card-source-label">FlowerAura Source Product</div>
        <div class="card-source-name">${statusDot}${sourceLink}</div>
        ${urlMissingNote}
        ${metaParts.length ? `<div class="card-source-meta">${metaParts.map(m=>`<span class="meta-tag">${escHtml(m)}</span>`).join('')}</div>` : ''}
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:.4rem">
        ${viewSourceBtn}
        <div class="card-num">${grp.recs.length} recommendation${grp.recs.length!==1?'s':''}</div>
      </div>
    </div>

    <div class="rec-table-wrap">
      <table>
        <thead><tr>
          <th>#</th><th>Product</th><th>Price</th>
          <th>Score</th><th>Match Type</th><th>Link</th>
        </tr></thead>
        <tbody>${recRows}</tbody>
      </table>
    </div>

    <div class="review-panel">
      <div class="review-panel-title">Your Review</div>
      <div class="review-row">
        <div class="rev-group">
          <label>Relevance</label>
          <div class="rel-toggle">
            <button class="rel-btn rel-yes${rev.relevant==='yes'?' active':''}" data-rel="yes" data-rel-key="${grp.sourceKey}">✓ Relevant</button>
            <button class="rel-btn rel-no${rev.relevant==='no'?' active':''}"  data-rel="no"  data-rel-key="${grp.sourceKey}">✗ Not Relevant</button>
          </div>
        </div>
        <div class="rev-group">
          <label>Rating</label>
          <div class="stars">${stars}</div>
        </div>
        <div class="rev-group" style="flex:1;min-width:180px">
          <label>Comment</label>
          <textarea class="comment-input" rows="2" placeholder="Optional notes…" data-comment-key="${grp.sourceKey}">${escHtml(rev.comment||'')}</textarea>
        </div>
        <div class="rev-group" style="align-self:flex-end">
          <span class="save-indicator" data-save-key="${grp.sourceKey}">✓ Saved</span>
        </div>
      </div>
    </div>
  </div>`;
}

function renderPagination(total, maxPage) {
  const wrap = document.getElementById('paginationWrap');
  if (maxPage <= 1) { wrap.innerHTML=''; return; }
  const cur = UI.currentPage;
  const pages = new Set([1, maxPage]);
  for (let p=Math.max(1,cur-2); p<=Math.min(maxPage,cur+2); p++) pages.add(p);
  const sorted = Array.from(pages).sort((a,b)=>a-b);
  let html = `<button class="page-btn" ${cur===1?'disabled':''} data-page="${cur-1}">‹</button>`;
  let last = 0;
  for (const p of sorted) {
    if (p - last > 1) html += `<span class="page-ellipsis">…</span>`;
    html += `<button class="page-btn${p===cur?' active':''}" data-page="${p}">${p}</button>`;
    last = p;
  }
  html += `<button class="page-btn" ${cur===maxPage?'disabled':''} data-page="${cur+1}">›</button>`;
  wrap.innerHTML = html;
  wrap.querySelectorAll('[data-page]').forEach(btn => {
    btn.addEventListener('click', () => {
      UI.currentPage = parseInt(btn.dataset.page);
      renderCards();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

function exportCSV() {
  const reviews  = loadReviews();
  const reviewer = document.getElementById('headerReviewer').value || '';
  const headers  = ['source_key','source_name','source_url','relevant','rating','comment','reviewer','reviewed_at'];
  const rows = DATA.groups.map(g => {
    const rev = reviews[g.sourceKey] || {};
    return [g.sourceKey, g.sourceName, g.sourceUrl, rev.relevant||'', rev.rating||'', rev.comment||'', reviewer, rev.updatedAt||''];
  });
  const csv  = [headers, ...rows].map(r => r.map(escapeCSV).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = `floweraura_reviews_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  showToast('✓ Reviews exported');
}

function showValidationReport() {
  const v = DATA.validation;
  const lines = [
    `=== FlowerAura URL Mapping Validation Report ===`,
    `Generated: ${new Date().toLocaleString()}`,
    ``,
    `SUMMARY`,
    `  Total recommendations : ${v.total}`,
    `  Valid URLs            : ${v.ok}`,
    `  Missing rec URLs      : ${v.missingRecUrl.length}`,
    `  Missing source URLs   : ${v.missingSourceUrl.length}`,
    ``,
  ];
  if (v.missingSourceUrl.length) {
    lines.push(`SOURCE PRODUCTS WITHOUT URL (${v.missingSourceUrl.length})`);
    v.missingSourceUrl.forEach(k => {
      const g = DATA.groups.find(x => x.sourceKey===k);
      lines.push(`  [${k}] ${g?.sourceName||k}`);
    });
    lines.push('');
  }
  if (v.missingRecUrl.length) {
    lines.push(`RECOMMENDATIONS WITHOUT URL (${v.missingRecUrl.length})`);
    v.missingRecUrl.forEach(r => lines.push(`  Source ${r.sourceKey} | Rank ${r.rank} | ${r.recName}`));
    lines.push('');
  }
  if (!v.missingSourceUrl.length && !v.missingRecUrl.length) {
    lines.push(`✅ ALL ${v.total} PRODUCTS CORRECTLY MAPPED — zero missing URLs.`);
  }
  const blob = new Blob([lines.join('\n')], {type:'text/plain'});
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = `floweraura_url_validation_${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
  showToast('✓ Validation report downloaded');
}

let _sugRows = null, _prodRows = null;

document.getElementById('sugFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  document.getElementById('sugName').textContent = f.name;
  document.getElementById('sugWrap').classList.add('active');
  readFile(f).then(txt => { _sugRows = parseCSV(txt); checkReady(); });
});

document.getElementById('prodFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  document.getElementById('prodName').textContent = f.name;
  document.getElementById('prodWrap').classList.add('active');
  readFile(f).then(txt => { _prodRows = parseCSV(txt); });
});

function checkReady() {
  document.getElementById('loadBtn').disabled = !_sugRows || !_sugRows.length;
}

document.getElementById('loadBtn').addEventListener('click', () => {
  document.getElementById('loadSpinner').style.display = 'inline-block';
  document.getElementById('loadBtn').disabled = true;
  setTimeout(initApp, 60);
});

function initApp() {
  const baseUrl = document.getElementById('baseUrlInput').value.trim() || CONFIG.baseUrl;
  DATA.baseUrl  = baseUrl;

  const sugHeaders = Object.keys(_sugRows[0]||{});
  DATA.colMap = detectColumns(sugHeaders,
    ['source_id','source_name','source_url','source_price','result_name','result_url','result_price','score','match_quality','rank']);

  const required = ['source_name','result_name'];
  if (required.some(f => !DATA.colMap[f])) {
    showMapper(sugHeaders); return;
  }

  buildAndRender(baseUrl);
}

function showMapper(headers) {
  document.getElementById('uploadScreen').style.display = 'none';
  document.getElementById('mapperScreen').style.display = 'block';
  const grid   = document.getElementById('mapperGrid');
  const fields = [
    {key:'source_name',label:'Source Product Name',req:true},
    {key:'source_id',  label:'Source Product ID'},
    {key:'source_url', label:'Source Product URL'},
    {key:'source_price',label:'Source Price'},
    {key:'result_name',label:'Recommendation Name',req:true},
    {key:'result_url', label:'Recommendation URL'},
    {key:'result_price',label:'Recommendation Price'},
    {key:'score',      label:'Similarity Score'},
    {key:'match_quality',label:'Match Quality'},
    {key:'rank',       label:'Rank'},
  ];
  grid.innerHTML = fields.map(f => `
    <div class="mapper-row">
      <label>${f.label}${f.req?'<span style="color:var(--red)"> *</span>':''}</label>
      <select data-map="${f.key}">
        <option value="">— not mapped —</option>
        ${headers.map(h=>`<option value="${escHtml(h)}"${DATA.colMap[f.key]===h?' selected':''}>${escHtml(h)}</option>`).join('')}
      </select>
    </div>`).join('');

  document.getElementById('mapperConfirm').onclick = () => {
    grid.querySelectorAll('select[data-map]').forEach(sel => {
      if (sel.value) DATA.colMap[sel.dataset.map] = sel.value;
    });
    if (!DATA.colMap.source_name || !DATA.colMap.result_name) {
      alert('Please map Source Name and Recommendation Name.'); return;
    }
    document.getElementById('mapperScreen').style.display = 'none';
    buildAndRender(DATA.baseUrl);
  };
}

function buildAndRender(baseUrl) {
  // Build product URL map from products catalog (FlowerAura source of truth)
  const prodUrlMap = {};
  if (_prodRows) {
    const ph = Object.keys(_prodRows[0]||{});
    const pm = detectColumns(ph, ['prod_id','prod_url']);
    if (pm.prod_id && pm.prod_url) {
      for (const row of _prodRows) {
        const id  = row[pm.prod_id];
        const url = row[pm.prod_url];
        if (id && url) prodUrlMap[id] = url;
      }
    }
  }

  DATA.groups   = buildGroups(_sugRows, DATA.colMap, prodUrlMap, baseUrl);
  DATA.filtered = DATA.groups.map((_,i) => i);
  UI.currentPage = 1;

  document.getElementById('uploadScreen').style.display = 'none';
  document.getElementById('mapperScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('loadSpinner').style.display = 'none';

  renderCards();
  showToast(`✓ Loaded ${DATA.groups.length} FlowerAura products`);
}

});

document.getElementById('exportBtn').addEventListener('click', exportCSV);
document.getElementById('validationBtn').addEventListener('click', showValidationReport);
document.getElementById('clearBtn').addEventListener('click', () => {
  if (confirm('Clear all saved reviews? This cannot be undone.')) {
    localStorage.removeItem(LS_KEY); renderCards(); showToast('✓ All reviews cleared');
  }
});

// Sheets URL is baked in — set sync status on load
if (sheetsUrl) setSyncStatus('idle', '⬤ connected');

// Reviewer name
document.getElementById('headerReviewer').addEventListener('input', e =>
  localStorage.setItem(LS_REVIEWER, e.target.value));
document.getElementById('headerReviewer').value = localStorage.getItem(LS_REVIEWER) || '';
</script>

<script>
// Auto-init: data is baked in — show review UI immediately, no upload step
document.addEventListener('DOMContentLoaded', function() {
  if (window.__PRELOADED__ && window.__PRELOADED__.length > 0) {
    DATA.groups    = window.__PRELOADED__;
    DATA.filtered  = DATA.groups.map(function(_, i){ return i; });
    DATA.baseUrl   = window.__BASE_URL__ || 'https://www.floweraura.com';
    UI.currentPage = 1;
    document.getElementById('app').style.display = 'block';
    renderCards();
  }
});
</script>
</body>
</html>
